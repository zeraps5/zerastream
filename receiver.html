<!doctype html>
<html><head><meta charset="utf-8"><title>Zera Stream</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
video{width:100%;height:100%;object-fit:contain;background:#000}
#st{position:fixed;left:12px;bottom:10px;color:#9f6;font:14px sans-serif;opacity:.8}
</style>
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
</head><body>
<video id="v" muted autoplay playsinline></video>
<div id="st">Zera Stream</div>
<script>
'use strict';
const NS = 'urn:x-cast:zerastream';
const v = document.getElementById('v'), st = document.getElementById('st');
let ws = null, ms = null, sb = null, queue = [], url = null;

function status(t) { st.textContent = t; }

function avcCodec(init) {
  // finds the avcC box: profile, compatibility and level follow its version byte
  for (let i = 4; i + 8 < init.length; i++)
    if (init[i] === 0x61 && init[i+1] === 0x76 && init[i+2] === 0x63 && init[i+3] === 0x43) {
      const h = b => b.toString(16).padStart(2, '0');
      return 'avc1.' + h(init[i+5]) + h(init[i+6]) + h(init[i+7]);
    }
  return 'avc1.4d4020';
}

function pump() {
  if (!sb || sb.updating || !queue.length) return;
  // keep only the last few seconds: old frames are dropped from the buffer
  if (v.buffered.length && v.currentTime - v.buffered.start(0) > 10) {
    sb.remove(0, v.currentTime - 5); return;
  }
  sb.appendBuffer(queue.shift());
}

function chase() {
  // stay at the live edge: a game wants the newest frame, not every frame
  if (v.buffered.length) {
    const end = v.buffered.end(v.buffered.length - 1), lag = end - v.currentTime;
    if (lag > 0.25) v.currentTime = end - 0.02;
    if (v.paused) v.play().catch(() => {});
    status('Zera Stream  ' + Math.round(lag * 1000) + ' ms');
  }
  requestAnimationFrame(chase);
}

function connect(u) {
  url = u;
  if (ws) ws.close();
  ws = new WebSocket(u); ws.binaryType = 'arraybuffer';
  let first = true;
  ws.onopen = () => status('Zera Stream: conectado');
  ws.onmessage = e => {
    const d = new Uint8Array(e.data);
    if (first) {
      first = false; queue = [d];
      ms = new MediaSource();
      v.src = URL.createObjectURL(ms);
      ms.addEventListener('sourceopen', () => {
        sb = ms.addSourceBuffer('video/mp4; codecs="' + avcCodec(d) + '"');
        sb.mode = 'segments';
        sb.addEventListener('updateend', pump);
        pump();
      }, { once: true });
      return;
    }
    queue.push(d);
    if (queue.length > 120) queue.splice(1, queue.length - 60);
    pump();
  };
  ws.onclose = () => { status('Zera Stream: reconectando...'); sb = null; setTimeout(() => url === u && connect(u), 1000); };
}

const q = new URLSearchParams(location.search).get('ws');
if (q) connect(q);
if (window.cast && cast.framework) {
  const ctx = cast.framework.CastReceiverContext.getInstance();
  ctx.addCustomMessageListener(NS, ev => { const m = ev.data; if (m && m.ws) connect(m.ws); });
  const o = new cast.framework.CastReceiverOptions();
  o.disableIdleTimeout = true; o.skipPlayersLoad = true;
  ctx.start(o);
}
requestAnimationFrame(chase);
</script>
</body></html>
